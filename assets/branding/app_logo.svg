<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b324a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Outer rounded badge -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#bgGrad)" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="2.5"/>

  <!-- Subtle inner technical grid ring -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="#38bdf8" stroke-opacity="0.14" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Isometric cube / factory module -->
  <polygon points="64,26 94,43 64,60 34,43" fill="#7dd3fc" fill-opacity="0.92"/>
  <polygon points="34,43 64,60 64,92 34,75" fill="url(#cyanGrad)"/>
  <polygon points="64,60 94,43 94,75 64,92" fill="#0f4c75"/>

  <!-- Conveyor / automation flow bar -->
  <rect x="26" y="88" width="76" height="10" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="38" cy="93" r="2.6" fill="url(#amberGrad)"/>
  <circle cx="55" cy="93" r="2.6" fill="#38bdf8"/>
  <circle cx="72" cy="93" r="2.6" fill="#38bdf8"/>
  <circle cx="89" cy="93" r="2.6" fill="url(#amberGrad)"/>

  <!-- PLC pulse / node highlight on top -->
  <polyline points="48,43 56,43 60,36 66,49 71,43 80,43" fill="none" stroke="#0d1b2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
